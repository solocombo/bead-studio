<title>串珠盤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@500;600&display=swap">
<style>
/* Layout: one-screen app — velvet stage with three views (散盤 / 串珠盤 / 戴上看) on top, material drawer below; side by side on desktop */
:root{
  --bg:#eceee9; --surface:#f7f8f5; --fg:#1c2523; --muted:#66716c; --line:#d2d7d1;
  --accent:#8f6b2a; --accent-soft:#efe5d2; --danger:#a33b2f;
  --velvet-1:#1d3c39; --velvet-2:#0d2120;
  --f-display:"Noto Serif TC","Songti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1514; --surface:#18201e; --fg:#e4e9e6; --muted:#93a09a; --line:#2b3633;
  --accent:#cfa75c; --accent-soft:#2c271b; --danger:#e07a6b; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f1514; --surface:#18201e; --fg:#e4e9e6; --muted:#93a09a; --line:#2b3633;
  --accent:#cfa75c; --accent-soft:#2c271b; --danger:#e07a6b; color-scheme:dark }

html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:auto auto auto 1fr;grid-template-areas:"head" "stage" "sel" "panel";padding-inline:16px;gap:10px;box-sizing:border-box;padding-block:10px 0}
.head{grid-area:head;display:flex;flex-direction:column;gap:8px;min-width:0}
.total{display:flex;flex-direction:column;align-items:flex-start;gap:0;min-width:0;line-height:1.15}
.price{font-family:var(--f-num);font-size:24px;font-weight:500;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.count{color:var(--muted);font-size:13px;white-space:nowrap}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.acts{display:flex;gap:6px;flex:none}
.views{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden;min-width:0}
.view{flex:1;background:var(--surface);border:0;border-left:1px solid var(--line);padding:8px 4px;font-family:var(--f-display);font-weight:500;letter-spacing:.06em;white-space:nowrap;color:var(--muted)}
.view:first-child{border-left:0}
.view[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.act{display:flex;align-items:center;gap:5px;border:1px solid var(--accent);background:transparent;color:var(--accent);padding:7px 10px;border-radius:3px;font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.04em;white-space:nowrap}
.act.solid{background:var(--accent);color:var(--surface)}
.act:disabled{opacity:.4;cursor:default}
.act svg{width:15px;height:15px;flex:none}

.stage{grid-area:stage;position:relative;height:min(calc(100vw - 32px),48svh);background:radial-gradient(ellipse at 50% 40%,var(--velvet-1),var(--velvet-2) 75%);border-radius:4px;display:grid;place-items:center;overflow:hidden}
.stage canvas{display:block;touch-action:none;grid-area:1/1}
.tool{position:absolute;display:flex;gap:6px;z-index:2}
.tool.tr{top:10px;right:10px}
.stage[data-mode="wear"] .tool.tr{flex-direction:column}
.tool.tl{top:10px;left:10px;align-items:center}
.tool.bl{bottom:10px;left:10px;right:10px;justify-content:space-between;align-items:flex-end;pointer-events:none}
.tool.bl>*{pointer-events:auto}
.ibtn{width:36px;height:36px;display:grid;place-items:center;background:rgba(6,18,17,.55);border:1px solid rgba(220,200,150,.25);color:#e8dcc0;border-radius:2px}
.ibtn:disabled{opacity:.35;cursor:default}
.ibtn svg{width:18px;height:18px}
.wrist{display:flex;align-items:center;gap:6px;background:rgba(6,18,17,.55);border:1px solid rgba(220,200,150,.25);color:#e8dcc0;padding:0 4px 0 10px;height:36px;border-radius:2px;font-size:12px}
.wrist select{background:transparent;color:#f3e8cc;border:0;font-family:var(--f-num);font-size:13px;padding:4px 2px}
.wrist select option{color:#1c2523;background:#fff}
.wrist .sep{width:1px;height:16px;background:rgba(220,200,150,.3)}
.tones{display:flex;gap:6px;background:rgba(6,18,17,.6);border:1px solid rgba(220,200,150,.2);padding:6px 8px;border-radius:2px;align-items:center}
.tone{width:20px;height:20px;border-radius:50%;border:1px solid rgba(255,255,255,.35);padding:0}
.tone[aria-pressed="true"]{box-shadow:0 0 0 2px #0d2120,0 0 0 3.5px #d8b25e}
.tones .th{color:#d9cdb0;font-size:11px;margin-left:4px;white-space:nowrap}
.w3msg{position:absolute;top:56px;left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);text-align:center;color:#efe3c4;font-size:12px;pointer-events:none;z-index:2;background:rgba(6,18,17,.7);border:1px solid rgba(220,200,150,.2);padding:5px 10px;border-radius:2px}
.len{background:rgba(6,18,17,.6);border:1px solid rgba(220,200,150,.25);color:#efe3c4;padding:6px 10px;border-radius:2px;display:flex;flex-direction:column;gap:1px;margin-left:auto;text-align:right}
.len b{font-family:var(--f-display);font-weight:500;font-size:15px;letter-spacing:.04em}
.len b.ok{color:#bfe0a0}.len b.over{color:#f0a894}
.len small{font-family:var(--f-num);font-size:11px;color:#b9ad90}
.hint{color:#d9cdb0;font-size:11px;max-width:12em;line-height:1.4;background:rgba(6,18,17,.6);border:1px solid rgba(220,200,150,.2);padding:5px 8px;border-radius:2px}

.sel{grid-area:sel;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);padding:8px 10px;border-radius:3px;min-width:0}
.sel .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sel .nm span{color:var(--muted);font-family:var(--f-num);font-size:12px;margin-left:6px}
.sel button{border:1px solid var(--line);background:transparent;padding:5px 10px;border-radius:2px;font-size:13px}
.sel button.rm{border-color:var(--danger);color:var(--danger)}

.panel{grid-area:panel;min-height:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:4px 4px 0 0}
.filters{display:flex;flex-direction:column;gap:8px;padding:10px 12px 8px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tab{background:transparent;border:0;border-bottom:2px solid transparent;padding:6px 10px;color:var(--muted);letter-spacing:.12em;white-space:nowrap;font-family:var(--f-display);font-weight:500}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.dots{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.dot{width:26px;height:26px;border-radius:50%;border:1px solid rgba(0,0,0,.15);flex:none}
.dot[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--accent)}
.dot.all{background:conic-gradient(#a9c76a,#e2c25c,#efb3bd,#a985c4,#9fc7d8,#e9eeec,#a9c76a)}
.grid{flex:1;min-height:0;overflow-y:auto;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;align-content:start;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.card{position:relative}
.card .add{width:100%;height:100%;background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:8px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.card .add:active{transform:scale(.97)}
.card .info{position:absolute;top:5px;left:5px;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-family:var(--f-display);font-weight:600;font-size:12px;display:grid;place-items:center;padding:0}
.card img{object-fit:contain}
.card img{width:64px;height:64px}
.card .n{font-family:var(--f-display);font-weight:500;font-size:13px;line-height:1.3}
.card .s{font-family:var(--f-num);font-size:11px;color:var(--muted)}
.card .p{font-family:var(--f-num);font-size:12px}
.card .b{position:absolute;top:5px;right:5px;pointer-events:none;min-width:18px;height:18px;padding:0 5px;box-sizing:border-box;border-radius:9px;background:var(--accent);color:var(--surface);font-family:var(--f-num);font-size:11px;display:grid;place-items:center}
.empty{grid-column:1/-1;color:var(--muted);padding:24px 8px;text-align:center}

@media (min-width:860px){
  .app{grid-template-columns:1fr 400px;grid-template-rows:auto 1fr auto;grid-template-areas:"head panel" "stage panel" "sel panel";padding-block:16px;column-gap:20px}
  .stage{height:auto;min-height:0}
  .panel{border-bottom:1px solid var(--line);border-radius:4px}
  .price{font-size:28px}
}
@media (prefers-reduced-motion: reduce){ .card .add:active{transform:none} }
.viewrow{display:flex;gap:6px;min-width:0}
.viewrow .views{flex:1}
.act.done{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* bottom sheets: bead info, export */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-back{position:absolute;inset:0;background:rgba(8,14,13,.55)}
.sheet-card{position:relative;background:var(--surface);color:var(--fg);width:100%;max-width:560px;max-height:90%;overflow-y:auto;border-radius:12px 12px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));box-sizing:border-box;display:flex;flex-direction:column;gap:16px}
.sheet-card>*{flex:none}
.sheet-x{position:absolute;top:8px;right:8px;width:40px;height:40px;border:0;background:transparent;font-size:24px;line-height:1;color:var(--muted)}
.gal{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding-inline:4px}
.gal img{width:136px;height:136px;flex:none;border-radius:4px;background:radial-gradient(ellipse at 50% 40%,var(--velvet-1),var(--velvet-2) 80%);object-fit:contain;padding:10px;box-sizing:border-box}
.info-head h2{font-family:var(--f-display);font-weight:600;font-size:24px;margin:0;letter-spacing:.04em;text-wrap:balance}
.info-head .meta{font-family:var(--f-num);color:var(--muted);font-size:13px;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.props{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;margin:0;font-size:14px;border-block:1px solid var(--line);padding-block:12px}
.props dt{color:var(--muted)} .props dd{margin:0;min-width:0}
.blk h3{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.08em;margin:0 0 6px}
.md{line-height:1.8;font-size:14px;max-width:65ch}
.md p{margin:.3em 0} .md ul{margin:.3em 0;padding-left:1.2em} .md h4{margin:.8em 0 .2em;font-size:14px}
.sheet .primary{width:100%;padding:12px;border:0;border-radius:4px;background:var(--accent);color:var(--surface);font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.1em}
.sheet .secondary{flex:1;padding:11px;border:1px solid var(--line);border-radius:4px;background:transparent;font-size:14px}
.devbox{border:1px dashed var(--line);border-radius:4px;padding:12px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:8px}
.devbox input{font-size:13px;max-width:100%}
.note{font-size:12px;color:var(--muted)}
.exp-img{width:100%;border-radius:4px;border:1px solid var(--line);display:block}
.exp-btns{display:flex;gap:8px;flex-wrap:wrap}
.exp-text{width:100%;box-sizing:border-box;min-height:150px;font-family:var(--f-num);font-size:12px;line-height:1.6;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:10px;resize:vertical}
@media (min-width:860px){ .sheet{align-items:center} .sheet-card{border-radius:8px} }
</style>

<div class="app">
  <header class="head">
    <div class="top">
      <div class="total">
        <span class="price" id="price">NT$0</span>
        <span class="count" id="count">0 顆</span>
      </div>
      <div class="acts">
        <button class="act" id="shuffleBtn" title="把現有的珠子打亂順序串起來"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h3.5c2 0 3.2 1 4.3 2.7l2.4 4.6C14.3 16 15.5 17 17.5 17H21M18 14l3 3-3 3M3 17h3.5c1.4 0 2.4-.5 3.2-1.4M14.3 8.4c.8-.9 1.8-1.4 3.2-1.4H21M18 4l3 3-3 3"/></svg>隨機串珠</button>
        <button class="act solid" id="randBtn" title="自動挑選搭配的素材，湊成一條手串"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1.2" fill="currentColor"/><circle cx="15" cy="15" r="1.2" fill="currentColor"/><circle cx="15" cy="9" r="1.2" fill="currentColor"/><circle cx="9" cy="15" r="1.2" fill="currentColor"/></svg>隨機選珠</button>
      </div>
    </div>
    <div class="viewrow">
    <div class="views" role="tablist" aria-label="檢視">
      <button class="view" role="tab" id="v-dish" data-mode="dish" aria-selected="true">散盤</button>
      <button class="view" role="tab" id="v-board" data-mode="board" aria-selected="false">串珠盤</button>
      <button class="view" role="tab" id="v-wear" data-mode="wear" aria-selected="false">戴上看</button>
    </div>
    <button class="act done" id="doneBtn" title="輸出設計單：快照、價格、顆數、明細">完成</button>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="串珠工作區">
    <canvas id="gl" hidden></canvas>
    <canvas id="cv"></canvas>
    <div class="w3msg" id="w3msg" hidden></div>
    <div class="tool tl">
      <label class="wrist" for="wrist">手圍
        <select id="wrist">
          <option value="13">13 cm</option><option value="14">14 cm</option><option value="15">15 cm</option>
          <option value="16" selected>16 cm</option><option value="17">17 cm</option><option value="18">18 cm</option><option value="19">19 cm</option>
        </select>
        <span class="sep"></span>
        <select id="fit" aria-label="鬆緊">
          <option value="-5">貼手</option><option value="0" selected>標準</option><option value="5">寬鬆</option>
        </select>
      </label>
    </div>
    <div class="tool tr">
      <button class="ibtn" id="undoBtn" aria-label="復原" title="復原"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button class="ibtn" id="shakeBtn" aria-label="搖散" title="搖散"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="8" cy="9" r="3"/><circle cx="16" cy="15" r="3"/><circle cx="16.5" cy="6.5" r="1.6"/><path d="M3 17c1.5 1.5 3 1.5 4.5 0M17 21c1.2-.8 2.4-.8 3.6 0"/></svg></button>
      <button class="ibtn" id="flipBtn" aria-label="翻面" title="翻面（手背／手掌）" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 9"/><path d="M20 4v5h-5"/><path d="M20 12a8 8 0 0 1-13.7 5.6L4 15"/><path d="M4 20v-5h5"/></svg></button>
      <button class="ibtn" id="centerBtn" aria-label="視角置中" title="視角置中" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
      <button class="ibtn" id="clearBtn" aria-label="清空" title="清空"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
    </div>
    <div class="tool bl">
      <span class="hint" id="hint"></span>
      <div class="tones" id="tones" hidden></div>
      <div class="len" aria-live="polite"><b id="lenMain">還差約 0 mm</b><small id="lenSub">目標 175 mm</small></div>
    </div>
  </section>

  <div class="sel" id="sel" hidden>
    <span class="nm" id="selName"></span>
    <button id="selCancel">取消</button>
    <button class="rm" id="selRemove">移除</button>
  </div>

  <section class="panel" aria-label="素材">
    <div class="filters">
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="dots" id="dots"></div>
    </div>
    <div class="grid" id="grid"></div>
  </section>
</div>

<div class="sheet" id="infoSheet" hidden role="dialog" aria-modal="true" aria-labelledby="infoTitle">
  <div class="sheet-back" data-close></div>
  <div class="sheet-card">
    <button class="sheet-x" data-close aria-label="關閉">×</button>
    <div class="gal" id="infoGal"></div>
    <div class="info-head"><h2 id="infoTitle"></h2><div class="meta" id="infoMeta"></div></div>
    <div class="chips" id="infoChips"></div>
    <dl class="props" id="infoProps"></dl>
    <div id="infoBlocks" style="display:flex;flex-direction:column;gap:16px"></div>
    <button class="primary" id="infoAdd">加入盤中</button>
    <div class="devbox">
      <label for="photoInput">試用實拍照片（最多 3 張，每顆珠子會隨機用其中一張）</label>
      <input type="file" id="photoInput" accept="image/*" multiple>
      <span>只在這台裝置暫時預覽，重新整理就會消失。部署後這裡會改成上傳到後端。照片請用去背 PNG、正方形、珠子置中並佔畫面寬度約 90%。</span>
    </div>
    <p class="note">介紹文字為範例內容，上線前請換成你的商品資料。</p>
  </div>
</div>

<div class="sheet" id="expSheet" hidden role="dialog" aria-modal="true" aria-labelledby="expTitle">
  <div class="sheet-back" data-close></div>
  <div class="sheet-card">
    <button class="sheet-x" data-close aria-label="關閉">×</button>
    <div class="info-head"><h2 id="expTitle">設計單</h2><div class="meta">長按圖片即可儲存</div></div>
    <img class="exp-img" id="expImg" alt="手串設計單">
    <div class="exp-btns">
      <button class="secondary" id="copyBtn">複製文字明細</button>
      <button class="secondary" id="submitBtn" hidden>送出訂單</button>
    </div>
    <label class="note" for="expText">文字明細（可貼到 LINE）</label>
    <textarea class="exp-text" id="expText" readonly></textarea>
    <p class="note" id="expNote"></p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
(() => {
const { Engine, Bodies, Body, Composite, Events, Constraint, Runner } = Matter;
const TAU = Math.PI * 2, DISH_MM = 112, TOL_MM = 3;
const dpr = Math.min(window.devicePixelRatio || 1, 3);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- backend hooks ----------
   Deployed: web/config.js sets window.BEAD_CONFIG = { apiBase: 'https://<ref>.supabase.co/functions/v1/api' }.
   Endpoints (supabase/functions/api):
     GET  {apiBase}/catalog  → [{id, name, cat, kind, d, w, price, color, images:[url…], info:{…}}]
                               synced from Notion; replaces the built-in sample catalog
     POST {apiBase}/orders   ← buildOrder() JSON; prices are re-checked on the server → {id}
   Without apiBase everything runs from the built-in sample catalog below. */
const CONFIG = Object.assign({ apiBase:null, photoFill:.9, variants:3 }, window.BEAD_CONFIG||{});
const DataSource = {
  async loadCatalog(){ const r=await fetch(CONFIG.apiBase+'/catalog'); if(!r.ok) throw new Error('catalog '+r.status); return r.json(); },
  async submitOrder(order){
    const r=await fetch(CONFIG.apiBase+'/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(order)});
    if(!r.ok) throw new Error('送出失敗（'+r.status+'）'); return r.json(); },

function specular(c,r,a){

const imgCache=new Map();
let onPhotosChanged=()=>{};
function photoFor(it,v){
  if(!it.images.length) return null;
  const url=it.images[v%it.images.length]; let im=imgCache.get(url);
  if(!im){ im=new Image(); im.crossOrigin='anonymous'; im.onload=()=>{ spriteCache.clear(); onPhotosChanged(); }; im.src=url; imgCache.set(url,im); }

  const key=it.id+'@'+S.toFixed(3)+'#'+(img?v%it.images.length:'d'); let sp=spriteCache.get(key); if(sp) return sp;
  if(spriteCache.size>400) spriteCache.clear();
  const box=img?Math.max(it.d,it.w)*S/CONFIG.photoFill:0;
  const half=Math.ceil(Math.max(Math.max(it.d,it.w)*S/2+2,box/2)), cv=document.createElement('canvas');
  cv.width=cv.height=half*2*dpr; const c=cv.getContext('2d'); c.scale(dpr,dpr); c.translate(half,half);
  if(img) c.drawImage(img,-box/2,-box/2,box,box); else drawItem(c,it,S);

function boardGeom(){

const mmToAng=(g,mm)=>-Math.PI/2+mm/g.L*TAU;

  const c2=document.createElement('canvas'); c2.width=c2.height=side*dpr; const c=c2.getContext('2d'); c.scale(dpr,dpr);
  const Ro=side*.445;
  let gr=c.createRadialGradient(cx+side*.02,cy+side*.04,Ro*.8,cx+side*.02,cy+side*.04,Ro*1.06);
  gr.addColorStop(0,'rgba(0,0,0,.55)'); gr.addColorStop(1,'rgba(0,0,0,0)'); c.fillStyle=gr; c.fillRect(0,0,side,side);
  gr=c.createRadialGradient(cx-Ro*.3,cy-Ro*.35,0,cx,cy,Ro);
  gr.addColorStop(0,'#f4f5f1'); gr.addColorStop(.8,'#e2e5de'); gr.addColorStop(1,'#c9cec5');

  gr.addColorStop(0,'#b6bcb1'); gr.addColorStop(.3,'#d0d5cb'); gr.addColorStop(.85,'#e3e6df'); gr.addColorStop(1,'#c6cbc1');
  c.fillStyle=gr; c.fill();

  c.textAlign='center'; c.textBaseline='middle'; c.font=`500 ${Math.max(9,10*u)}px "IBM Plex Mono",monospace`;
  for(let m=0;m<=Math.floor(g.L);m++){
    const big=m%10===0, mid=m%5===0; if(!big&&!mid&&g.Sb<2.4) continue;
    const a=mmToAng(g,m), h=(big?8:mid?5:2.6)*u;
    c.strokeStyle=big?'rgba(70,60,40,.75)':'rgba(90,80,60,.4)'; c.lineWidth=big?1.1:.7;
    c.beginPath(); c.moveTo(cx+Math.cos(a)*t0,cy+Math.sin(a)*t0); c.lineTo(cx+Math.cos(a)*(t0+h),cy+Math.sin(a)*(t0+h)); c.stroke();
    if(big&&(g.L-m)>4){ const tr=t0+h+8*u; c.fillStyle='rgba(70,60,40,.85)'; c.fillText(m/10,cx+Math.cos(a)*tr,cy+Math.sin(a)*tr); }

  c.fillStyle='#b0452f'; c.font=`600 ${Math.max(10,11*u)}px "Noto Sans TC",sans-serif`;

/* Bare cord is spread over the gaps between beads. Each bead keeps a random weight for the gap after it
   (about a third get none), so the cord shows in a few uneven places rather than one block. */
const gapW=new Map();
function gw(uid){ if(!gapW.has(uid)) gapW.set(uid,Math.random()<.35?0:.15+Math.random()); return gapW.get(uid); }
function gapFn(list,exposed){ const sum=list.reduce((a,s)=>a+gw(s.uid),0);
  return uid=>exposed<=0?0:sum>0?exposed*gw(uid)/sum:exposed/list.length; }
function boardLayout(g){
  const gap=gapFn(seq,Math.max(0,g.L-g.W));
  const out=new Map(); let cum=0, idx=0, gapDone=!bDrag||!bDrag.moved;
  seq.forEach(s=>{ if(bDrag&&bDrag.moved&&s.uid===bDrag.uid) return; const w=CAT[s.id].w;
    if(!gapDone&&bDrag.insert===idx){ cum+=bDrag.w+gap(bDrag.uid); gapDone=true; }
    out.set(s.uid,cum+w/2); cum+=w+gap(s.uid); idx++; });
  return out;
}
const ptToMM=(g,p)=>((Math.atan2(p.y-cy,p.x-cx)+Math.PI/2)%TAU+TAU)%TAU/TAU*g.L;
function insertIndex(g,p){
  const mm=ptToMM(g,p), gap=gapFn(seq,Math.max(0,g.L-g.W)); let cum=0, i=0;
  for(const s of seq){ if(s.uid===bDrag.uid) continue; const w=CAT[s.id].w; if(cum+w/2>mm) return i; cum+=w+gap(s.uid); i++; }
  return i;
}
function drawBoard(now){
  const g=boardGeom(); ctx.drawImage(buildBoard(g),0,0,side,side);
  const tgt=boardLayout(g), k=(reduceMotion||SNAP)?1:.2;
  if(g.W>0){ ctx.strokeStyle='rgba(150,120,70,.8)'; ctx.lineWidth=1.4; ctx.beginPath(); ctx.arc(cx,cy,g.R,0,TAU); ctx.stroke(); }
  const pts=[];
  for(const s of seq){
    if(bDrag&&bDrag.moved&&s.uid===bDrag.uid) continue;
    const t=tgt.get(s.uid); let cur=boardPos.get(s.uid); if(cur==null) cur=t;
    cur+=(t-cur)*k; boardPos.set(s.uid,cur);
    const th=mmToAng(g,cur); pts.push({s,it:CAT[s.id],x:cx+Math.cos(th)*g.R,y:cy+Math.sin(th)*g.R,a:th+Math.PI/2});
  }
  for(const q of pts) shadow(ctx,q.it,g.Sb,q.x,q.y,q.a,1,.3);
  for(const q of pts){ blit(ctx,q.it,g.Sb,q.x,q.y,q.a,1,q.s.v); if(q.s.uid===selected&&!SNAP) ring(q.x,q.y,Math.max(q.it.d,q.it.w)/2*g.Sb+4); }
  if(bDrag&&bDrag.moved){ const it=CAT[bDrag.id], a=Math.atan2(bDrag.p.y-cy,bDrag.p.x-cx)+Math.PI/2;
    shadow(ctx,it,g.Sb,bDrag.p.x,bDrag.p.y,a,4,.35); blit(ctx,it,g.Sb,bDrag.p.x,bDrag.p.y-6,a,1.25,bDrag.v); }
  if(!seq.length){ emptyText('點下方素材，排進串珠盤',cy); return; }
  // inner diameter of the finished bracelet: centre-line circumference / π minus the main bead size
  const rounds=seq.map(s=>CAT[s.id]).filter(i=>i.kind!=='spacer');
  const d=rounds.length?rounds.reduce((a,i)=>a+i.d,0)/rounds.length:0, inner=g.L/Math.PI-d, u=side/380;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='rgba(90,96,88,.85)'; ctx.font=`500 ${Math.max(11,11*u)}px "Noto Sans TC",sans-serif`; ctx.fillText('內圈直徑約',cx,cy-12*u);
  ctx.fillStyle='rgba(40,46,42,.9)'; ctx.font=`500 ${Math.max(16,20*u)}px "IBM Plex Mono",monospace`; ctx.fillText(`${Math.max(0,inner).toFixed(0)} mm`,cx,cy+10*u);
  ctx.textBaseline='alphabetic';
}
function hitBoard(p){
  const g=boardGeom(); let best=null, bd=Infinity;
  for(const s of seq){ const it=CAT[s.id], mm=boardPos.get(s.uid); if(mm==null) continue;
    const th=mmToAng(g,mm), x=cx+Math.cos(th)*g.R, y=cy+Math.sin(th)*g.R, d=Math.hypot(p.x-x,p.y-y);
    if(d<Math.max(Math.max(it.d,it.w)/2*g.Sb,14)&&d<bd){ bd=d; best=s; } }
  return best;
}

/* One smooth hand: a signed-distance field (palm, wrist, fingers blended with smooth-min)
   meshed with surface nets, so joints flow into each other instead of looking assembled.
   Built once at a 16 cm wrist, then scaled to the chosen 手圍. Left hand, back facing +z. */
const HAND_A=30.5, HAND_B=19.8;   // wrist half-width / half-depth (oval perimeter ≈ 160 mm)
const v3=(x,y,z)=>[x,y,z], vadd=(a,b,t=1)=>[a[0]+b[0]*t,a[1]+b[1]*t,a[2]+b[2]*t];
const vnorm=a=>{ const l=Math.hypot(...a)||1; return [a[0]/l,a[1]/l,a[2]/l]; };
const vcross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];

  const segs=[], nails=[], knuckles=[];
  const fx=[-26,-8.5,9,26.5], fr=[7.2,8,8.3,7.9], fl=[60,76,82,74], sp=[.12,.04,-.01,-.08], props=[.43,.3,.24], curls=[.08,.16,.12];
  for(let i=0;i<4;i++){
    let P=v3(fx[i],94,-1.5); const ax=[Math.cos(sp[i]),Math.sin(sp[i]),0], d0=[-Math.sin(sp[i]),Math.cos(sp[i]),0];
    knuckles.push({p:vadd(P,[0,0,1],7.5),r:fr[i]*.95});
    let cur=0, r=fr[i];
    for(let j=0;j<3;j++){ cur+=curls[j]; const d=vrot(d0,ax,-cur), L=fl[i]*props[j], Q=vadd(P,d,L), r2=r*(j===2?.86:.94);

    if(j===2){ const d=tdirs[j]; let n=vnorm([.75,-.25,.6]); const dd=n[0]*d[0]+n[1]*d[1]+n[2]*d[2]; n=vnorm(vadd(n,d,-dd)); nails.push({tip:Q,d,n,r:tr[3],L:tl[j]}); }

const pick=a=>a[Math.random()*a.length|0];
function randomDesign(){
  const beads=ITEMS.filter(i=>i.cat==='bead');
  let mains=fColor!=='all'?beads.filter(b=>b.color===fColor):beads; if(!mains.length) mains=beads;
  const M=pick(mains);
  const accPool=beads.filter(b=>b.id!==M.id&&COMPAT[M.color].includes(b.color)&&b.d<=M.d);
  const A=accPool.length?pick(accPool):M, warm=WARM.has(M.color);
  const SP=pick(ITEMS.filter(i=>i.cat==='spacer'&&i.tone===(warm?GOLD:SILV)));
  const BALL=CAT[warm?'ballG3':'ballS3'];
  const U=pick([[M,SP,A,SP],[M,M,SP,A,SP],[M,BALL,A,BALL],[M,A,M,SP],[M,SP],[M,M,A]]);
  const T=wristMM()+easeFor(M.d), uw=U.reduce((a,i)=>a+i.w,0), out=[]; let W=0;
  while(W+uw<=T+1){ U.forEach(i=>out.push(i)); W+=uw; }
  for(let k=0;T-W>1.5&&k<40;k++){
    const r=T-W, nx=U[out.length%U.length];
    const f=nx.w<=r+2?nx:[M,A,SP,BALL].filter(i=>i.w<=r+2).sort((a,b)=>b.w-a.w)[0];
    if(!f) break; out.push(f); W+=f.w;
  }
  return out.map(i=>i.id);
}

    c.querySelector('.add').onclick=()=>addItem(it.id); c.querySelector('.info').onclick=()=>openInfo(it.id); gridEl.appendChild(c); });
}
function select(uid){
  selected=uid; const el=document.getElementById('sel');

}
function refresh(){
  const price=seq.reduce((a,s)=>a+CAT[s.id].price,0), W=totalW(), T=targetLen(), diff=T-W;
  document.getElementById('price').textContent='NT$'+price.toLocaleString('en-US');

  const m=document.getElementById('lenMain');

  m.className=ok?'ok':diff<0?'over':'';

  document.getElementById('lenSub').textContent=`已串 ${W.toFixed(1)} / 目標 ${T} mm`;
  document.getElementById('lenSub').title=`目標 = 手圍 ${wristMM()} + 鬆份 ${(T-wristMM())} mm（依主珠約 ${mainBeadD().toFixed(1)} mm 計算）；目標 ±${TOL_MM} mm 內都算合適`;
  document.getElementById('undoBtn').disabled=!history.length;
  document.getElementById('shuffleBtn').disabled=seq.length<2;
  document.getElementById('doneBtn').disabled=!seq.length;

}

/* ---------- sheets ---------- */
let lastFocus=null;
function openSheet(el){ lastFocus=document.activeElement; el.hidden=false; el.querySelector('.sheet-x').focus(); }
function closeSheet(el){ el.hidden=true; if(lastFocus&&lastFocus.focus) lastFocus.focus(); }
document.querySelectorAll('.sheet').forEach(sh=>sh.addEventListener('click',e=>{ if(e.target.closest('[data-close]')) closeSheet(sh); }));
addEventListener('keydown',e=>{ if(e.key==='Escape') document.querySelectorAll('.sheet:not([hidden])').forEach(closeSheet); });
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function md(src){
  const inline=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>'); const out=[]; let list=null;
  for(const line of (src||'').split('\n')){ const l=line.trim();
    if(l.startsWith('- ')){ (list=list||[]).push('<li>'+inline(l.slice(2))+'</li>'); continue; }
    if(list){ out.push('<ul>'+list.join('')+'</ul>'); list=null; }
    if(!l) continue; out.push(l.startsWith('### ')?'<h4>'+inline(l.slice(4))+'</h4>':'<p>'+inline(l)+'</p>'); }
  if(list) out.push('<ul>'+list.join('')+'</ul>'); return out.join('');
}
const COLOR_NAME=Object.fromEntries(COLORS.map(([k,l])=>[k,l]));
const CAT_NAME={bead:'主珠',spacer:'隔片',ball:'隔珠'};
let infoId=null;
function bigRender(it){ const c=document.createElement('canvas'); c.width=c.height=272; const x=c.getContext('2d'); x.scale(2,2); x.translate(68,68); drawItem(x,it,Math.min(10,100/Math.max(it.d,it.w))); return c.toDataURL(); }
function openInfo(id){
  const it=CAT[id], inf=it.info||{}; infoId=id;
  const pics=it.images.length?it.images:[bigRender(it)];
  document.getElementById('infoGal').innerHTML=pics.map((u,i)=>`<img alt="${esc(it.name)} 照片 ${i+1}" src="${esc(u)}">`).join('');

  document.getElementById('infoMeta').textContent=`${sizeLabel(it)} · NT$${it.price} / 顆`;
  const chips=[CAT_NAME[it.cat],COLOR_NAME[it.color],...(inf.months||[]).map(m=>`${m} 月生日石`),...(inf.tags||[]).filter(t=>!/生日石/.test(t))];
  document.getElementById('infoChips').innerHTML=chips.filter(Boolean).map(t=>`<span class="chip">${esc(t)}</span>`).join('');
  const props=[['尺寸',it.kind==='spacer'?`高 ${it.d}mm・串上佔 ${it.w}mm`:`直徑 ${it.d}mm`],['產地',inf.origin],['等級',inf.grade],['單價',`NT$${it.price}`]];
  document.getElementById('infoProps').innerHTML=props.filter(p=>p[1]).map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('');
  document.getElementById('infoBlocks').innerHTML=[['價格說明',inf.price],['故事',inf.story],['寓意',inf.meaning]].filter(b=>b[1])
    .map(([h,t])=>`<section class="blk"><h3>${h}</h3><div class="md">${md(t)}</div></section>`).join('');
  document.getElementById('photoInput').value='';
  openSheet(document.getElementById('infoSheet'));
}
document.getElementById('infoAdd').onclick=()=>{ if(infoId){ addItem(infoId); closeSheet(document.getElementById('infoSheet')); } };
document.getElementById('photoInput').onchange=async e=>{

  const it=CAT[infoId];
  it.images=await Promise.all(files.map(f=>new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(f); })));
  spriteCache.clear(); onPhotosChanged(); openInfo(it.id);
};
onPhotosChanged=()=>{ if(W3.ready){ W3.tex.clear(); W3.photoGen++; } renderGrid(); };

/* ---------- 完成: design sheet ---------- */
function snapshotBoard(px){
  const save={side,cx,cy,ctx,bc:boardCache,sel:selected};
  const c=document.createElement('canvas'); c.width=c.height=Math.round(px*dpr);
  side=px; cx=cy=px/2; ctx=c.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); boardCache=null; SNAP=true; selected=null;
  try{ drawBoard(0); } finally { SNAP=false; side=save.side; cx=save.cx; cy=save.cy; ctx=save.ctx; boardCache=save.bc; selected=save.sel; }
  return c;
}
function buildOrder(){
  const groups=new Map();
  seq.forEach(s=>{ const it=CAT[s.id]; const g=groups.get(s.id)||{id:s.id,name:it.name,size:sizeLabel(it),unit:it.price,qty:0}; g.qty++; groups.set(s.id,g); });
  const items=[...groups.values()].map(g=>({...g,subtotal:g.unit*g.qty}));
  const code=Math.random().toString(36).slice(2,8).toUpperCase();
  return { code, createdAt:new Date().toISOString(), wristMM:wristMM(), fit:document.getElementById('fit').selectedOptions[0].text,
    lengthMM:+totalW().toFixed(1), targetMM:targetLen(), count:seq.length, total:items.reduce((a,i)=>a+i.subtotal,0),
    items, sequence:seq.map(s=>({id:s.id,v:s.v})), source:BeadStudio.orderSource };
}
function orderText(o){
  const d=new Date(o.createdAt), ds=`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
  const lines=[`【手串設計單】#${o.code}　${ds}`,`手圍 ${o.wristMM/10} cm（${o.fit}）｜已串 ${o.lengthMM} mm／目標 ${o.targetMM} mm`,'──────────'];
  o.items.forEach(i=>lines.push(`${i.name} ${i.size}　× ${i.qty}　NT$${i.subtotal.toLocaleString('en-US')}`));
  lines.push('──────────',`共 ${o.count} 顆　合計 NT$${o.total.toLocaleString('en-US')}`,'',
    '串法順序：'+o.sequence.map(s=>{ const it=CAT[s.id]; return it.name+(it.kind==='spacer'?'':it.d); }).join(' → '));
  return lines.join('\n');
}
function renderSheetImage(o){
  const W=1080, P=64, rows=o.items.length, H=P+120+952+48+150+rows*84+120+P;
  const c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');
  const ink='#1c2523', mute='#66716c', line='#d2d7d1', acc='#8f6b2a';
  x.fillStyle='#f4f5f1'; x.fillRect(0,0,W,H);
  x.fillStyle=ink; x.font='600 46px "Noto Serif TC",serif'; x.textBaseline='alphabetic'; x.fillText('手串設計單',P,P+46);
  const d=new Date(o.createdAt); x.fillStyle=mute; x.font='400 24px "IBM Plex Mono",monospace';
  x.fillText(`#${o.code}  ${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`,P,P+92);
  let y=P+120;
  const g=x.createRadialGradient(W/2,y+380,80,W/2,y+476,700); g.addColorStop(0,'#1d3c39'); g.addColorStop(1,'#0d2120');
  x.fillStyle=g; rrect(x,P,y,952,952,8); x.fill();
  x.drawImage(snapshotBoard(952),P,y,952,952); y+=952+48;
  const stats=[['總價',`NT$${o.total.toLocaleString('en-US')}`],['顆數',`${o.count} 顆`],['串長',`${o.lengthMM} mm`]];
  stats.forEach(([k,v],i)=>{ const sx=P+i*318; x.fillStyle=mute; x.font='400 24px "Noto Sans TC",sans-serif'; x.fillText(k,sx,y+28);
    x.fillStyle=i===0?acc:ink; x.font='500 44px "IBM Plex Mono",monospace'; x.fillText(v,sx,y+84); });
  x.fillStyle=mute; x.font='400 22px "Noto Sans TC",sans-serif'; x.fillText(`手圍 ${o.wristMM/10} cm・${o.fit}・目標 ${o.targetMM} mm`,P,y+124);
  y+=150; x.strokeStyle=line; x.lineWidth=2; x.beginPath(); x.moveTo(P,y); x.lineTo(W-P,y); x.stroke();
  o.items.forEach(i=>{ const it=CAT[i.id], sp=sprite(it,5.2,0), cy0=y+42;
    x.drawImage(sp.cv,P+30-sp.half,cy0-sp.half,sp.half*2,sp.half*2);
    x.fillStyle=ink; x.font='500 30px "Noto Serif TC",serif'; x.textAlign='left'; x.fillText(i.name,P+84,cy0+2);
    x.fillStyle=mute; x.font='400 22px "IBM Plex Mono",monospace'; x.fillText(`${i.size} · NT$${i.unit}`,P+84,cy0+32);
    x.fillStyle=ink; x.font='500 28px "IBM Plex Mono",monospace'; x.textAlign='right';
    x.fillText(`× ${i.qty}`,W-P-220,cy0+10); x.fillText(`NT$${i.subtotal.toLocaleString('en-US')}`,W-P,cy0+10); x.textAlign='left';
    y+=84; x.strokeStyle=line; x.lineWidth=1; x.beginPath(); x.moveTo(P,y); x.lineTo(W-P,y); x.stroke(); });
  x.fillStyle=ink; x.font='600 32px "Noto Sans TC",sans-serif'; x.fillText('合計',P,y+56);
  x.textAlign='right'; x.fillStyle=acc; x.font='500 40px "IBM Plex Mono",monospace'; x.fillText(`NT$${o.total.toLocaleString('en-US')}`,W-P,y+58); x.textAlign='left';
  x.fillStyle=mute; x.font='400 20px "Noto Sans TC",sans-serif'; x.fillText(`長度在目標 ±${TOL_MM} mm 內視為合適・價格以實際出貨為準`,P,y+104);
  return c.toDataURL('image/png');
}
let lastOrder=null;
function openExport(){
  if(!seq.length) return;
  const o=buildOrder(); lastOrder=o;
  try{ document.getElementById('expImg').src=renderSheetImage(o); document.getElementById('expImg').hidden=false; }
  catch(err){ console.warn('sheet image',err); document.getElementById('expImg').hidden=true; }
  document.getElementById('expText').value=orderText(o);
  document.getElementById('submitBtn').hidden=!CONFIG.apiBase;

}

  catch{ ta.focus(); ta.select(); b.textContent='已選取，請按複製'; }
  setTimeout(()=>b.textContent='複製文字明細',2000);
};
document.getElementById('submitBtn').onclick=async()=>{
  const b=document.getElementById('submitBtn'), n=document.getElementById('expNote');
  b.disabled=true; n.textContent='送出中…';
  try{ const r=await DataSource.submitOrder(lastOrder); n.textContent=`已送出，訂單編號 ${r.id||lastOrder.code}`; }
  catch(err){ n.textContent=err.message+'，請稍後再試。'; b.disabled=false; }
};
/* Server catalog (from Notion) replaces the sample one. Items without photos fall back to a drawn bead
   tinted by their 色系, so a new product shows up before it has been photographed. */
const COLOR_BASE={clear:[226,233,233],grey:[128,134,138],black:[34,33,36],green:[150,200,120],yellow:[236,188,78],pink:[240,184,196],purple:[150,94,186],blue:[168,210,226]};
function fromServer(r){
  const local=CAT[r.id]||{}, kind=r.kind||local.kind||(r.cat==='spacer'?'spacer':r.cat==='ball'?'metal':'gem');
  const it=Object.assign({},local,r,{kind});
  it.d=+it.d||8; it.w=+r.w||(kind==='spacer'?2:it.d); it.price=+it.price||0;
  it.images=r.images||[]; it.info=Object.assign({},local.info||{},r.info||{});
  if(kind==='gem'&&!it.p) it.p={base:COLOR_BASE[it.color]||[200,200,200],clear:it.color==='black'?0:.5,glow:[255,255,255]};
  if((kind==='metal'||kind==='spacer')&&!it.tone) it.tone=it.color==='yellow'?GOLD:SILV;
  return it;
}
if(CONFIG.apiBase){
  document.querySelector('.devbox').hidden=true;
  DataSource.loadCatalog().then(list=>{
    const items=list.map(fromServer); if(!items.length) return;
    ITEMS.length=0; Object.keys(CAT).forEach(k=>delete CAT[k]);
    items.forEach(it=>{ ITEMS.push(it); CAT[it.id]=it; if(!thumbs[it.id]){ const c=document.createElement('canvas'); c.width=c.height=128; const x=c.getContext('2d'); x.scale(2,2); x.translate(32,32); drawItem(x,it,5); thumbs[it.id]=c.toDataURL(); } });
    spriteCache.clear(); boardCache=null;
    const keep=seq.filter(s=>CAT[s.id]); if(keep.length!==seq.length) restore(keep.map(s=>({...s})));
    onPhotosChanged(); refresh();
  }).catch(err=>console.warn('catalog',err));
}

Array.from({length:9},()=>['rut10','spG','peri8']).flat()

/* ---------- plugin interface ----------
   Add-ons (e.g. web/ar.js for AR try-on) use only this object, so the main page can change freely
   as long as these stay the same. */
const BeadStudio = window.BeadStudio = {
  version: 1,
  stage,                                   // the stage <section>; add-ons may append their own controls
  get mode(){ return mode; },
  onModeChange(fn){ modeListeners.push(fn); fn(mode); },
  // stop drawing and physics while something else (the camera view) needs the phone's GPU
  setPaused(on){ if(on===paused) return; paused=on; if(on) Runner.stop(runner); else Runner.run(runner,engine); },
  orderSource: 'web',                      // saved with each order so test pages can be told apart
};
setMode('dish'); refresh();
requestAnimationFrame(frame);
window.dispatchEvent(new Event('beadstudio:ready'));
})();
